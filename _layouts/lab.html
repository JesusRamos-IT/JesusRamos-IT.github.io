<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <title>{{ page.title }}</title>
</head>
<body>
    <header class="lab-header">
        <div class="header-overlay">
            <div class="header-content">
                <h1>🧪 MODO LAB: {{ page.title }}</h1>
                <p class="tagline">{{ page.subtitle }}</p>
                <a href="{{ '/' | relative_url }}" class="btn-github">Volver al Dashboard</a>
            </div>
        </div>
    </header>

    <div class="container">
        <article class="card">
            {{ content }}
        </article>
    </div>
</body>
</html>
